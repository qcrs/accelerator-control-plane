apiVersion: accelerator.qcrs.io/v1alpha1
kind: AcceleratorWorkload
metadata:
  name: complex-image-segmentation
  namespace: default
  labels:
    accelerator.qcrs.io/demo: complex-image
    accelerator.qcrs.io/task: image-segmentation
spec:
  accelerator:
    deviceType: GPU
    vendor: nvidia
    count: 1
    containerName: worker
  placement:
    mode: RemoteOnly
    reservationTTL: 10m
  podTemplate:
    metadata:
      labels:
        app: complex-image-segmentation
        accelerator.qcrs.io/demo: complex-image
      annotations:
        accelerator.qcrs.io/purpose: remote-image-segmentation
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: cricket-image-demos:cuda12.8
          imagePullPolicy: IfNotPresent
          env:
            - name: DEMO_TASK
              value: image-segmentation
            - name: OUTPUT_PATH
              value: /tmp/image-segmentation-mask.pgm
