apiVersion: accelerator.qcrs.io/v1alpha1
kind: AcceleratorWorkload
metadata:
  name: complex-batch-resize
  namespace: default
  labels:
    accelerator.qcrs.io/demo: complex-image
    accelerator.qcrs.io/task: batch-resize
spec:
  accelerator:
    deviceType: GPU
    vendor: nvidia
    count: 1
    containerName: worker
  placement:
    mode: RemoteOnly
    reservationTTL: 10m
  podTemplate:
    metadata:
      labels:
        app: complex-batch-resize
        accelerator.qcrs.io/demo: complex-image
      annotations:
        accelerator.qcrs.io/purpose: remote-batch-resize
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: cricket-image-demos:cuda12.8
          imagePullPolicy: IfNotPresent
          env:
            - name: DEMO_TASK
              value: batch-resize
            - name: OUTPUT_PATH
              value: /tmp/batch-resize.ppm
