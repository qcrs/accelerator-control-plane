apiVersion: v1
kind: Service
metadata:
  name: accelerator-manager-metrics
  namespace: accelerator-system
spec:
  selector:
    app.kubernetes.io/name: accelerator-control-plane
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: accelerator-manager
  namespace: accelerator-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: accelerator-control-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accelerator-manager
  namespace: accelerator-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: accelerator-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accelerator-control-plane
    spec:
      serviceAccountName: accelerator-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: accelerator-control-plane:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --coordination-namespace=accelerator-system
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 10
