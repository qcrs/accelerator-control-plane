apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlu-remote-server
  namespace: accelerator-system
  labels:
    app.kubernetes.io/name: mlu-remote-server
    accelerator.qcrs.io/runtime: mlu-remote
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlu-remote-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlu-remote-server
        accelerator.qcrs.io/runtime: mlu-remote
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: server
          image: mlu-remote-server:arm64-observed-v4
          imagePullPolicy: IfNotPresent
          env:
            - name: MLU_REMOTE_BIND
              value: "0.0.0.0"
            - name: MLU_REMOTE_PORT
              value: "50051"
            - name: MLU_REMOTE_OBSERVATION_PORT
              value: "50052"
          ports:
            - name: remote
              containerPort: 50051
              protocol: TCP
            - name: observation
              containerPort: 50052
              protocol: TCP
          securityContext:
            # The single-node hardware probe uses privileged mode while the
            # MLU device plugin/security profile is not installed. Replace
            # this with device-plugin allocation and a minimal capability set
            # before production deployment.
            privileged: true
          volumeMounts:
            - name: cambricon-ctl
              mountPath: /dev/cambricon_ctl
            - name: cambricon-dev0
              mountPath: /dev/cambricon_dev0
            - name: cambricon-gdr
              mountPath: /dev/cambricon_gdr
            - name: cambricon-ipcm0
              mountPath: /dev/cambricon_ipcm0
      volumes:
        - name: cambricon-ctl
          hostPath:
            path: /dev/cambricon_ctl
            type: CharDevice
        - name: cambricon-dev0
          hostPath:
            path: /dev/cambricon_dev0
            type: CharDevice
        - name: cambricon-gdr
          hostPath:
            path: /dev/cambricon_gdr
            type: CharDevice
        - name: cambricon-ipcm0
          hostPath:
            path: /dev/cambricon_ipcm0
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: mlu-remote-server
  namespace: accelerator-system
  labels:
    accelerator.qcrs.io/runtime: mlu-remote
spec:
  selector:
    app.kubernetes.io/name: mlu-remote-server
  ports:
    - name: remote
      port: 50051
      targetPort: remote
      protocol: TCP
    - name: observation
      port: 50052
      targetPort: observation
      protocol: TCP
