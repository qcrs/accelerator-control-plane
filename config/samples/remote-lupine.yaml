apiVersion: accelerator.qcrs.io/v1alpha1
kind: AcceleratorProvider
metadata:
  name: remote-lupine
spec:
  driver: lupine
  deviceKinds: [GPU]
  clientRuntime:
    image: ghcr.io/lupinemachines/lupine-client:cuda-13.1.0-ubuntu24.04-slim
    sourcePath: /opt/lupine/lib
    mountPath: /opt/accelerator/lupine
---
apiVersion: accelerator.qcrs.io/v1alpha1
kind: AcceleratorPool
metadata:
  name: remote-lupine
  labels:
    accelerator.qcrs.io/tier: remote
spec:
  providerRef:
    name: remote-lupine
  location: Remote
  deviceType: GPU
  priority: 10
  remote:
    endpointSelector:
      matchLabels:
        accelerator.qcrs.io/runtime: lupine
---
# The Agent normally creates and updates this object. It is included to show
# the registration interface; status and heartbeat Lease are Agent-owned.
apiVersion: accelerator.qcrs.io/v1alpha1
kind: AcceleratorEndpoint
metadata:
  name: lupine-host-a
  labels:
    accelerator.qcrs.io/runtime: lupine
spec:
  poolRef:
    name: remote-lupine
