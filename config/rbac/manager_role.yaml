apiVersion: v1
kind: ServiceAccount
metadata:
  name: accelerator-manager
  namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: accelerator-manager-role
rules:
  - apiGroups: ["accelerator.qcrs.io"]
    resources:
      - acceleratorproviders
      - acceleratorpools
      - acceleratorendpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["accelerator.qcrs.io"]
    resources:
      - acceleratorworkloads
      - acceleratorleases
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["accelerator.qcrs.io"]
    resources:
      - acceleratorworkloads/status
      - acceleratorleases/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["accelerator.qcrs.io"]
    resources:
      - acceleratorworkloads/finalizers
      - acceleratorleases/finalizers
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: accelerator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: accelerator-manager-role
subjects:
  - kind: ServiceAccount
    name: accelerator-manager
    namespace: accelerator-system
