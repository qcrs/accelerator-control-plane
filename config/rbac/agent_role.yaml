apiVersion: v1
kind: ServiceAccount
metadata:
  name: accelerator-remote-agent
  namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: accelerator-remote-agent-role
rules:
  - apiGroups: ["accelerator.qcrs.io"]
    resources: ["acceleratorendpoints"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["accelerator.qcrs.io"]
    resources: ["acceleratorendpoints/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["accelerator.qcrs.io"]
    resources: ["acceleratorpools"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: accelerator-remote-agent-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: accelerator-remote-agent-role
subjects:
  - kind: ServiceAccount
    name: accelerator-remote-agent
    namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: accelerator-remote-agent-heartbeat
  namespace: accelerator-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: accelerator-remote-agent-heartbeat
  namespace: accelerator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: accelerator-remote-agent-heartbeat
subjects:
  - kind: ServiceAccount
    name: accelerator-remote-agent
    namespace: accelerator-system
