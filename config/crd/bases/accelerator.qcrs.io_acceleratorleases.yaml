apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: acceleratorleases.accelerator.qcrs.io
spec:
  group: accelerator.qcrs.io
  scope: Namespaced
  names:
    kind: AcceleratorLease
    listKind: AcceleratorLeaseList
    plural: acceleratorleases
    singular: acceleratorlease
    shortNames: [alease]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Pool
          type: string
          jsonPath: .spec.poolRef.name
        - name: Expires
          type: date
          jsonPath: .status.expiresAt
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [owner, workloadGeneration, request, providerRef, poolRef, mode, targets, ttl]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: spec is immutable
              properties:
                owner:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                workloadGeneration:
                  type: integer
                  format: int64
                  minimum: 1
                request:
                  type: object
                  required: [deviceType, count]
                  properties:
                    deviceType:
                      type: string
                      enum: [GPU, NPU]
                    vendor:
                      type: string
                    count:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 128
                    memory:
                      x-kubernetes-int-or-string: true
                      anyOf:
                        - type: integer
                        - type: string
                    models:
                      type: array
                      items:
                        type: string
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    containerName:
                      type: string
                providerRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                poolRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                mode:
                  type: string
                  enum: [Local, Remote]
                targets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      nodeName:
                        type: string
                      endpointName:
                        type: string
                      deviceIDs:
                        type: array
                        items:
                          type: string
                      exclusive:
                        type: boolean
                      count:
                        type: integer
                        format: int32
                ttl:
                  type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum: [Pending, Reserved, Bound, Releasing, Released, Failed, Expired]
                binding:
                  type: object
                  properties:
                    id:
                      type: string
                    endpoints:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name, address, runtime]
                        properties:
                          name:
                            type: string
                            minLength: 1
                          address:
                            type: string
                            minLength: 1
                            maxLength: 255
                          runtime:
                            type: object
                            required: [driver]
                            properties:
                              driver:
                                type: string
                                minLength: 1
                              version:
                                type: string
                              apiVersion:
                                type: string
                          parameters:
                            type: object
                            additionalProperties:
                              type: string
                expiresAt:
                  type: string
                  format: date-time
                podRef:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      type:
                        type: string
